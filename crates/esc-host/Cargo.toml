[package]
name = "esc-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Plugin host: mounts the tunnel plugin in-process and the web panel as a subprocess plugin"

[lib]
name = "esc_host"
path = "src/lib.rs"

[[bin]]
name = "esc-host"
path = "src/main.rs"

[dependencies]
esc-control-api = { workspace = true }
esc-plugin-tunnel = { workspace = true }
echo-context = { workspace = true }
echo-plugin = { workspace = true }
echo-plugin-host = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
esc-common = { workspace = true }
