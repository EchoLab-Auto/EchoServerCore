[package]
name = "esc-plugin-panel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Web panel as a subprocess plugin: REST + single-file UI, talks to the tunnel via HostCall only"

[lib]
name = "esc_plugin_panel"
path = "src/lib.rs"

[[bin]]
name = "esc-plugin-panel"
path = "src/main.rs"

[dependencies]
esc-control-api = { workspace = true }
esc-panel-auth = { workspace = true }
echo-plugin-sdk = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
esc-common = { workspace = true }
esc-engine = { workspace = true }
esc-control-api = { workspace = true }
esc-host = { path = "../esc-host" }
echo-plugin-host = { workspace = true }
