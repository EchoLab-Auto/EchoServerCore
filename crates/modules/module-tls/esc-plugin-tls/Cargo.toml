bytes = "1"
http-body-util = "0.1"

[dev-dependencies]
tokio = { workspace = true }
# 测试里现生成自签证书，不依赖仓库里有没有 /etc/ssl/esc —— 那些文件只在部署机上。
rcgen = { workspace = true }
rustls-pemfile = { workspace = true }
rustls = { workspace = true }
