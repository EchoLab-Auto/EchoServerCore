[package]
name = "esc-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Authenticating reverse proxy in front of esc web panels (session auth, per-route ACL)"

[lib]
name = "esc_gateway"
path = "src/lib.rs"

[[bin]]
name = "esc-gateway"
path = "src/main.rs"

[dependencies]
esc-panel-auth = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
# 转发核心。axum 0.8 本来就跑在 hyper 1.x 上，用同一套栈而不是再引一个 HTTP 客户端。
hyper = { version = "1.12", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client-legacy"] }
http-body-util = "0.1"
bytes = "1"
# 口令哈希。argon2id 是当前推荐，且纯 Rust（无 C 依赖，交叉编译/容器构建都省事）。
argon2 = "0.5"
# 会话 id 用 CSPRNG
rand = "0.8"
# cookie 解析
cookie = "0.18"

[dev-dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
axum = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
