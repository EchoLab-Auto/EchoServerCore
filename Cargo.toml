[workspace]
resolver = "2"
members = [
    # ── 底座：跨插件复用的库与契约 ──────────────────────────────────────
    "crates/esc-common",       # 配置 / TLS / 线协议 / yamux / PKI
    "crates/esc-control-api",  # 控制面契约（DTO + 方法名 + trait）
    "crates/esc-engine",       # 隧道内核（hub / spoke，可编程）
    "crates/esc-panel-auth",   # 面板与网关共用的访问控制

    # ── 宿主与独立进程 ─────────────────────────────────────────────────
    "crates/esc-host",         # 组合根：Ctx + 插件挂载 + HostCall 服务
    "crates/esc-gateway",      # 独立进程：认证反向代理

    # ── CLI ───────────────────────────────────────────────────────────
    "crates/esc-cli",          # 单个二进制 esc（hub / spoke / check / pki）
    "crates/esc-hub",          # 兼容层：esc hub 的薄封装
    "crates/esc-spoke",        # 兼容层：esc spoke 的薄封装

    # ── 插件：一个插件一个目录，目录里放属于它的 crate ──────────────────
    "crates/plugins/tunnel/esc-plugin-tunnel",
    "crates/plugins/edge-router/esc-plugin-edge-router",
    # 两个 Web 面板同属「panel」这一族：一个子进程插件 + 一个独立进程 +
    # 它们共用的前端产物。面板前端只被这两个用，所以放在这里而不是顶层。
    "crates/plugins/panel/esc-plugin-tunnel-panel",
    "crates/plugins/panel/esc-server-panel",
    "crates/plugins/panel/esc-panel-web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/EchoLab-Auto/echo-server-core"
description = "Reverse-tunnel port forwarding over mutually-authenticated TLS"

[workspace.dependencies]
# ── async runtime ────────────────────────────────────────────────────
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "time", "sync", "fs"] }

# ── TLS：用 ring 而非 aws-lc-rs，避免构建期依赖 cmake/nasm ─────────────
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2.2"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }

# ── 多路复用 ─────────────────────────────────────────────────────────
yamux = "0.14"
futures = { version = "0.3", default-features = false, features = ["std", "io-compat"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }

# ── 序列化 ───────────────────────────────────────────────────────────
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
time = { version = "0.3", features = ["std"] }

# ── CLI / 错误 / 日志 ────────────────────────────────────────────────
clap = { version = "4.6", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "local-time"] }

axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
# 服务器面板读取 esc-host 插件树所用的只读 HTTP 客户端。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# 反向代理需要 http client：axum 只带 server 侧。hyper-util 的 legacy client
# 是 hyper 1.x 官方推荐的入门客户端（连接池 + keep-alive 都现成）。
hyper = { version = "1.12", default-features = false, features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
# 插件框架：宿主 / 插件契约 / 插件侧运行时。
#
# 仓库原名 plugin-framework，2026-11 更名为 echo-fabric-arch（同一 git 历史，
# 老 tag 与 commit 都还在，所以换了 URL 不影响已钉住的版本）。
#
# 钉在 tag 上（框架 README 的推荐做法）。`v0.14.0` = commit 0da765b，记在这里
# 是为了万一 tag 被移动时还能追溯到底跑的哪份代码。
# 注意：这些 crate 的 package version 恒为 0.1.0（仓库发布号走 git tag），
# 所以 `version = "0.1.0"` 之类的约束毫无意义，必须靠 tag 钉住。
echo-context = { git = "https://github.com/EchoLab-Auto/echo-fabric-arch.git", tag = "v0.14.0" }
echo-plugin = { git = "https://github.com/EchoLab-Auto/echo-fabric-arch.git", tag = "v0.14.0" }
echo-plugin-api = { git = "https://github.com/EchoLab-Auto/echo-fabric-arch.git", tag = "v0.14.0" }
echo-plugin-host = { git = "https://github.com/EchoLab-Auto/echo-fabric-arch.git", tag = "v0.14.0" }
echo-plugin-sdk = { git = "https://github.com/EchoLab-Auto/echo-fabric-arch.git", tag = "v0.14.0" }
async-trait = "0.1"
base64 = "0.22"

# ── 内部 crate ───────────────────────────────────────────────────────
esc-common = { path = "crates/esc-common" }
esc-control-api = { path = "crates/esc-control-api" }
esc-panel-auth = { path = "crates/esc-panel-auth" }
esc-server-panel = { path = "crates/plugins/panel/esc-server-panel" }
esc-gateway = { path = "crates/esc-gateway" }
esc-engine = { path = "crates/esc-engine" }
esc-plugin-tunnel = { path = "crates/plugins/tunnel/esc-plugin-tunnel" }
esc-plugin-edge-router = { path = "crates/plugins/edge-router/esc-plugin-edge-router" }
esc-panel-web = { path = "crates/plugins/panel/esc-panel-web" }
esc-host = { path = "crates/esc-host" }
esc-hub = { path = "crates/esc-hub" }
esc-spoke = { path = "crates/esc-spoke" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# 刻意**不用** `panic = "abort"`：隧道是数据面，任意一个转发任务里的 bug
# 不应该让整个进程退出、把所有已建立的连接一起断掉。用 unwind 时 tokio 会
# 隔离掉出 panic 的那个任务，其余连接继续转发（实测见 docs/ARCHITECTURE.md
# 「为什么 release 用 unwind」）。代价是二进制大一点——这个交易很划算。
panic = "unwind"
