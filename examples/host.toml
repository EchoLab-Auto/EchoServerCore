# 宿主配置：决定挂哪些插件、面板监听在哪。
#
# esc-host -c /etc/esc/host.toml

[engine]
# 引擎配置的路径（也可以把 [engine] 段直接写成引擎配置的内联形式）
config = "/etc/esc/engine.toml"
# 可选：覆盖映射表位置（默认取引擎配置同目录下的 mappings.toml）。
# 这个位置必须在运行时**可写**（原子写要在同目录建临时文件），
# 生产上配合 systemd 的 StateDirectory=esc 用 /var/lib/esc/mappings.toml。
# store = "/var/lib/esc/mappings.toml"

[panel]
# false = 纯隧道模式，没有任何管理面
enabled = true
# 面板插件可执行文件；相对路径按宿主可执行文件所在目录解析
command = "/usr/local/libexec/esc/esc-plugin-tunnel-panel"

# 原样透传给面板插件
[panel.config]
# 只绑回环；绑 0.0.0.0 必须配 auth，否则面板拒绝启动
listen = "127.0.0.1:8787"
auth   = "admin:换成你自己的口令"
title  = "隧道面板"

# ── 边缘路由（可选）：按 HTTP Host 的第一段把请求分到本机不同端口 ──────────
#
#   http://cad.<任意域名>:2229/   → 127.0.0.1:2228
#   http://panel.<任意域名>:2229/ → 127.0.0.1:8080
#
# 默认关闭（enabled = false）：它要 bind 端口，不该"默认打开"。
# 详见 docs/EDGE-ROUTER.md。
#
# [edge_router]
# enabled = true
#
# [edge_router.config]
# # 绑 80 需要 CAP_NET_BIND_SERVICE（见 deploy/esc-host.service）
# listen = ["0.0.0.0:2229", "0.0.0.0:80"]
# timeout_ms = 300000
#
# [edge_router.config.routes]
# cad = 2228                       # 前缀匹配：cad.任何域名 → 2228
# panel = 8080
# "cad.special.com" = 2229         # 键里带点 = 完整域名精确匹配（优先级更高）
