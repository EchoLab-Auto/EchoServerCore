# ─────────────────────────────────────────────────────────────────────
# esc spoke — 内网机器上的 agent
#
# 部署在要暴露服务的内网机器上。它主动向 hub 建立一条 mTLS 出站连接，
# 不需要在内网侧开放任何入站端口，也不需要公网 IP。
# ─────────────────────────────────────────────────────────────────────

[spoke]
# 稳定标识。hub 用它做授权与日志，改名字等于换了一台机器。
id = "home-nas"

# hub 的控制端口地址。域名或 IP 均可。
server = "esc.example.com:4433"

# 重连退避区间（毫秒）。断线后从这里开始指数增长，带 ±20% 抖动。
backoff_min_ms = 500
backoff_max_ms = 30000

# 单条连接上允许的最大并发流。超出后 hub 侧新连接会被拒绝。
max_streams = 512

# 可选：证书校验用的主机名，默认取 server 的 host 部分。
# 当 hub 证书的 SAN 与连接地址不一致时才需要填（例如用 IP 连但证书是域名）。
# server_name = "esc.example.com"

[tls]
ca_cert = "/etc/esc/ca.pem"
cert    = "/etc/esc/home-nas.pem"
key     = "/etc/esc/home-nas.key"

# ── 本机可以提供的服务 ────────────────────────────────────────────────
#
# 注意：这里只是"声明我能提供什么"。真正会不会被暴露到公网，
# 完全由 hub 的 [[service]] 列表决定。内网机器不能自行开公网端口。
#
# name  必须与 hub 配置里的 name 完全一致，否则会被拒绝。
# local 是本机的目标地址，hub 转发过来的字节会送到这里。

[[service]]
name  = "grafana"
local = "127.0.0.1:3000"

[[service]]
name  = "nas-ssh"
local = "127.0.0.1:22"
