# esc-gateway 的 compose 部署
#
# 用法：
#   1. 准备配置（先在宿主机上生成口令哈希）
#        docker run --rm -it esc-gateway:latest hash-password
#      把结果填进 /etc/esc/gateway.toml 的 [[user]] hash
#   2. 校验配置
#        docker run --rm -v /etc/esc/gateway.toml:/etc/esc/gateway.toml:ro \
#          esc-gateway:latest check -c /etc/esc/gateway.toml
#   3. 建账号库目录（要让 uid 65532 可写，见 volumes 注释）
#        install -d -o 65532 -g 65532 /var/lib/esc-gateway
#      并在 gateway.toml 里写 users_file = "/var/lib/esc-gateway/gateway-users.toml"
#      （不建也行：面板会退化成只读，账号只从 gateway.toml 来）
#   4. docker compose up -d
#
# ⚠ 必须 host 网络
#   网关要把请求转发到宿主机的 127.0.0.1:18787（面板）。用默认 bridge 网络时，
#   容器里的 127.0.0.1 是容器自己，转发必然失败。三种选择：
#     a) network_mode: host          ← 默认，最简单，性能最好（无 NAT）
#     b) 面板绑 0.0.0.0 + extra_hosts: host.docker.internal:host-gateway
#        然后把 upstream 改成 host.docker.internal:18787
#     c) 用 docker 网络 + 服务名（要求上游也跑在容器里）
#   (a) 的代价：网关的端口直接占宿主机端口，必须和面板错开——所以面板要退到
#   18787/18788 这类非默认端口（配置里也要改）。

services:
  gateway:
    image: esc-gateway:latest
    build:
      context: .
      dockerfile: Dockerfile
      # 国内构建时取消注释（先确认这两个源可达）：
      # args:
      #   CARGO_MIRROR: "sparse+https://rsproxy.cn/index/"
      #   GIT_PROXY: "https://gh-proxy.com/https://github.com/"
    container_name: esc-gateway
    # host 网络：见文件头的说明。不映射 -p，端口完全由 gateway.toml 决定。
    network_mode: host
    restart: unless-stopped

    volumes:
      - /etc/esc/gateway.toml:/etc/esc/gateway.toml:ro
      # 账号库（管理面板写的那个文件）。**必须可写**，否则 /__admin/ 只能是
      # 只读视图——根文件系统是 read_only，容器里没有地方落盘。
      #
      # 目录要属于镜像里的 uid 65532，否则写不进去：
      #   install -d -o 65532 -g 65532 /var/lib/esc-gateway
      # 或者干脆不挂这个卷，接受面板只读（账号就只从 gateway.toml 来）。
      - /var/lib/esc-gateway:/var/lib/esc-gateway

    environment:
      # 日志级别。生产用 info；排障时改 debug。
      RUST_LOG: info,esc_gateway=info
      ESC_GATEWAY_CONFIG: /etc/esc/gateway.toml

    # ── 加固 ──────────────────────────────────────────────────────────────
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # 只做网络 I/O，不需要任何特权能力。监听 <1024 端口时才需要
    # cap_add: [NET_BIND_SERVICE]。

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      # distroless 镜像里没有 shell，所以不能用 CMD-SHELL 写管道。
      # 用网关自己的 health 子命令：它会真的向第一个 route 的端口发
      # /__auth/healthz 并检查 200——比 `--version` 有意义得多。
      test:
        - CMD
        - /usr/local/bin/esc-gateway
        - health
        - -c
        - /etc/esc/gateway.toml
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
